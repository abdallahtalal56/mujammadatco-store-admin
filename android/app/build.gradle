plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mujammadatco.store'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mujammadatco.store'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.3.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
