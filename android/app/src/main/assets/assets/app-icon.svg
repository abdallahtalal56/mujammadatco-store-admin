    <circle cx="11" cy="10" r="4" fill="#fff" stroke="none"/>
    <path d="M11 6.5V-8a2.3 2.3 0 0 1 4.6 0V6.5"/>
  </g>

  <!-- fork (ready to serve) -->
  <g transform="translate(100 146)" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-7 -12v8a4 4 0 0 0 8 0v-8M-3 -12v20M1 -12v8a4 4 0 0 0 4 4v8"/>
