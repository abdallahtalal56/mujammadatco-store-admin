<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2b2b2b" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="192" height="192" rx="46" fill="#FFFFFF"/>

  <g filter="url(#soft)">
    <rect x="70" y="24" width="60" height="60" rx="12" fill="#9C7A4E" transform="rotate(45 100 54)"/>
    <rect x="24" y="70" width="60" height="60" rx="12" fill="#4CAE50" transform="rotate(45 54 100)"/>
    <rect x="116" y="70" width="60" height="60" rx="12" fill="#4FACDB" transform="rotate(45 146 100)"/>
    <rect x="70" y="116" width="60" height="60" rx="12" fill="#E8A33D" transform="rotate(45 100 146)"/>
  </g>

  <!-- barn + silo (the farm) -->
  <g transform="translate(100 52)" stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-15 6V-3L0 -13L15 -3V6Z"/>
    <path d="M-15 6H15"/>
    <path d="M-9 6V-1M-3 6V-1M3 6V-1M9 6V-1"/>
    <path d="M7 -8v-8M11 -9v-9"/>
    <path d="M0 6V-2"/>
  </g>

  <!-- sprout (freshness) -->
  <g transform="translate(54 100)" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 13V-1"/>
    <path d="M0 -1c-6.5 -1.5 -11 -8 -11 -8s8.5 -2.3 11 3.6"/>
    <path d="M0 5c6.5 -1.5 11 -8 11 -8s-8.5 -2.3 -11 3.6"/>
    <path d="M-9 13h18"/>
  </g>

  <!-- snowflake + thermometer (frozen) -->
  <g transform="translate(146 100)" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-6 0)">
      <path d="M0 -10v13"/>
      <path d="M-5 -7 5 3M-5 3 5 -7"/>
