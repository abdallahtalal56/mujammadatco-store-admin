<svg viewBox="0 0 750 590" xmlns="http://www.w3.org/2000/svg" dir="rtl" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2b2b2b" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="750" height="590" fill="#ffffff"/>

  <g transform="translate(375 175)">
    <g filter="url(#soft2)">
      <rect x="-65" y="-140" width="130" height="130" rx="24" fill="#9C7A4E" transform="rotate(45 0 -75)"/>
      <rect x="-140" y="-65" width="130" height="130" rx="24" fill="#4CAE50" transform="rotate(45 -75 0)"/>
      <rect x="10" y="-65" width="130" height="130" rx="24" fill="#4FACDB" transform="rotate(45 75 0)"/>
      <rect x="-65" y="10" width="130" height="130" rx="24" fill="#E8A33D" transform="rotate(45 0 75)"/>
    </g>

    <!-- barn + silo -->
    <g transform="translate(0 -75)" stroke="#fff" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-32 13V-6L0 -28L32 -6V13Z"/>
      <path d="M-32 13H32"/>
      <path d="M-19 13V-2M-6 13V-2M6 13V-2M19 13V-2"/>
      <path d="M15 -17v-17M23 -19v-19"/>
      <path d="M0 13V-4"/>
    </g>

    <!-- sprout -->
    <g transform="translate(-75 0)" stroke="#fff" stroke-width="4.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 28V-2"/>
      <path d="M0 -2c-14 -3 -24 -17 -24 -17s18.5 -5 24 7.8"/>
      <path d="M0 11c14 -3 24 -17 24 -17s-18.5 -5 -24 7.8"/>
      <path d="M-19 28h38"/>
    </g>

    <!-- snowflake + thermometer -->
    <g transform="translate(75 0)" stroke="#fff" stroke-width="4.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(-13 0)">
        <path d="M0 -22v28"/>
        <path d="M-11 -15 11 7M-11 7 11 -15"/>
      </g>
      <circle cx="24" cy="21" r="8.5" fill="#fff" stroke="none"/>
      <path d="M24 14V-17a5 5 0 0 1 10 0V14"/>
    </g>

    <!-- fork -->
    <g transform="translate(0 75)" stroke="#fff" stroke-width="4.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-15 -26v17a8.5 8.5 0 0 0 17 0v-17M-6.5 -26v43M2 -26v17a8.5 8.5 0 0 0 8.5 8.5v17.5"/>
