  </g>

  <text x="375" y="380" text-anchor="middle" font-family="Almarai, 'Segoe UI', Tahoma, sans-serif" font-weight="800" font-size="54" fill="#1B5D91">مجمداتكو</text>
  <text x="375" y="434" text-anchor="middle" font-family="Almarai, 'Segoe UI', Tahoma, sans-serif" font-weight="800" font-size="40" fill="#1B5D91">للتوريد والتوزيع</text>
  <text x="375" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="17" letter-spacing="4" fill="#8B98A3">FROZEN FOOD DISTRIBUTION</text>
  <line x1="295" y1="500" x2="455" y2="500" stroke="#E4EEF2" stroke-width="2"/>
  <text x="375" y="532" text-anchor="middle" font-family="Almarai, 'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="24" fill="#3A4652">مؤسسة المزرعاوي للمجمدات</text>
