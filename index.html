<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجمداتكو — B2B Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4F7;
  --surface:#FFFFFF;
  --ink:#122435;
  --ink-soft:#5C7080;
  --ink-faint:#93A7B5;
  --primary:#0E3A5C;
  --primary-2:#155585;
  --primary-tint:#E7F0F6;
  --ice:#37B7D8;
  --ice-tint:#E2F6FB;
  --appetite:#FF6A45;
  --appetite-dark:#E4501F;
  --appetite-tint:#FFE9E1;
  --success:#279C68;
  --success-tint:#E4F5EC;
  --warn:#E08A1E;
  --warn-tint:#FCEEDB;
  --info:#1E6FB0;
  --info-tint:#E3F0FA;
  --line:#DFE8EC;
  --shadow-sm:0 1px 2px rgba(15,45,66,.06), 0 1px 1px rgba(15,45,66,.04);
  --shadow-md:0 8px 20px -6px rgba(14,58,92,.18);
  --shadow-lg:0 20px 45px -12px rgba(14,58,92,.28);
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:11px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0;
  font-family:'IBM Plex Sans Arabic', -apple-system, sans-serif;
  background:#DCE7ED;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  min-height:100%;
}
h1,h2,h3,.display{font-family:'Almarai','IBM Plex Sans Arabic',sans-serif;}
button{font-family:inherit;}

/* ===== App shell (full viewport, no device mockup) ===== */
#stage{
  width:100%;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  background:var(--bg);
}
#frame{
  position:relative;
  width:100%;
  max-width:480px;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
}
#screens{
  position:relative;
  flex:1;
  overflow:hidden;
}
.screen{
  position:absolute;
  inset:0;
  overflow-y:auto;
  overflow-x:hidden;
  background:var(--bg);
  transform:translateX(0);
  opacity:1;
  transition:transform .32s cubic-bezier(.22,.61,.36,1), opacity .28s ease;
  -webkit-overflow-scrolling:touch;
  padding-bottom:96px;
}
.screen::-webkit-scrollbar{display:none;}
.screen[hidden]{display:none;}
.screen.enter-right{transform:translateX(102%);}
.screen.enter-left{transform:translateX(-102%);}
.screen.leave-left{transform:translateX(-102%);opacity:.6;}
.screen.leave-right{transform:translateX(102%);opacity:.6;}

/* ===== Status bar ===== */
.statusbar{
  display:none !important;
  height:0;
  padding:0 26px;
  padding-top:calc(env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;
  font-size:12.5px;font-weight:600;color:var(--ink);
  background:transparent;
  position:sticky;top:0;z-index:5;
}

/* ===== Admin command center ===== */
#frame.admin-mode{max-width:1240px;background:#f4f7fb;}
#frame.admin-mode .screen{background:#f4f7fb;padding-bottom:32px;}
#frame.admin-mode .bottom-nav{display:none;}
.admin-shell{padding:28px 30px 42px;direction:rtl;}
.admin-topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:26px;}
.admin-kicker{font-size:12px;color:#688096;font-weight:700;margin-bottom:5px;}
.admin-title{font-family:Almarai;font-size:25px;font-weight:800;color:#102c42;margin:0;}
.admin-top-actions{display:flex;gap:10px;align-items:center;}
.admin-user{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e2eaf0;border-radius:14px;padding:8px 12px;font-size:12px;color:#385166;}
.admin-avatar{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#0e3a5c,#37b7d8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;}
.admin-layout{display:grid;grid-template-columns:220px 1fr;gap:22px;direction:ltr;}
.admin-sidebar{background:#0f3048;border-radius:20px;padding:16px 12px;color:#fff;min-height:670px;direction:rtl;box-shadow:0 15px 30px rgba(15,48,72,.16);}
.admin-side-brand{display:flex;align-items:center;gap:10px;padding:8px 9px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;}
.admin-side-brand .brand-mark{width:34px;height:34px;}
.admin-side-brand b{font-family:Almarai;font-size:13px;}
.admin-side-brand small{display:block;color:#9cc4d8;font-size:10px;margin-top:2px;}
.admin-tab{width:100%;border:0;background:transparent;color:#b7cad6;text-align:right;padding:12px 13px;border-radius:11px;font-family:inherit;font-size:12px;cursor:pointer;margin:2px 0;}
.admin-tab:hover,.admin-tab.active{background:#1b5578;color:#fff;}
.admin-main{direction:rtl;min-width:0;}
.admin-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px;}
.admin-stat{background:#fff;border:1px solid #e3ebf0;border-radius:16px;padding:17px;position:relative;overflow:hidden;}
.admin-stat:after{content:"";position:absolute;left:-24px;bottom:-35px;width:90px;height:90px;border-radius:50%;background:#e8f6fb;}
.admin-stat .label{font-size:11px;color:#718698;font-weight:700;}
.admin-stat .value{font-family:Almarai;font-size:24px;font-weight:800;color:#143951;margin-top:9px;}
.admin-stat .trend{font-size:10px;color:#279c68;margin-top:6px;font-weight:700;}
.admin-panel{background:#fff;border:1px solid #e3ebf0;border-radius:18px;padding:20px;margin-bottom:18px;}
.admin-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;}
.admin-panel h3{font-family:Almarai;font-size:15px;margin:0;color:#15384f;}
.admin-panel-sub{font-size:11px;color:#8295a3;margin:4px 0 0;}
.admin-actions{display:flex;gap:8px;align-items:center;}
.admin-btn{border:0;border-radius:10px;padding:9px 13px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;}
.admin-btn.primary{background:#0e3a5c;color:#fff;}
.admin-btn.ghost{background:#eef5f8;color:#0e3a5c;}
.admin-btn.danger{background:#fff0ed;color:#d94e35;}
.admin-table-wrap{overflow:auto;}
.admin-table{width:100%;border-collapse:collapse;font-size:12px;min-width:620px;}
.admin-table th{text-align:right;color:#8295a3;font-weight:700;background:#f7fafb;padding:11px 12px;border-bottom:1px solid #e7eef2;}
.admin-table td{padding:12px;border-bottom:1px solid #eef3f5;color:#29475a;vertical-align:middle;}
.admin-table tr:last-child td{border-bottom:0;}
.admin-product{display:flex;align-items:center;gap:10px;min-width:180px;}
.admin-product-img{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.admin-product b{font-size:12px;color:#193c53;}
.admin-product small{display:block;color:#8a9aa5;font-size:10px;margin-top:2px;}
.admin-badge{display:inline-flex;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:700;}
.admin-badge.green{background:#e6f6ed;color:#279c68}.admin-badge.orange{background:#fff2dd;color:#bf7413}.admin-badge.blue{background:#e7f2fa;color:#1e6fb0}
.admin-row-actions{display:flex;gap:6px;justify-content:flex-start;}
.admin-icon-btn{border:0;background:#f1f5f7;color:#557083;width:29px;height:29px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:11px;}
.admin-icon-btn:hover{background:#dfeef4;color:#0e3a5c;}
.admin-form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.admin-field label{display:block;font-size:11px;color:#688096;font-weight:700;margin-bottom:6px;}
.admin-field input,.admin-field select{width:100%;padding:10px 11px;border:1px solid #dce7ed;border-radius:10px;font:inherit;font-size:12px;outline:0;background:#fbfdfe;color:#1c4056;}
.admin-field input:focus,.admin-field select:focus{border-color:#37b7d8;box-shadow:0 0 0 3px #e3f7fb;}
.admin-empty{padding:30px;text-align:center;color:#8aa0ae;font-size:12px;}
.admin-chart{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.admin-bars{height:150px;display:flex;align-items:end;gap:10px;padding:20px 6px 0;}
.admin-bar{flex:1;background:linear-gradient(180deg,#37b7d8,#0e3a5c);border-radius:7px 7px 2px 2px;min-height:16px;position:relative;}
.admin-bar span{position:absolute;bottom:-20px;right:0;left:0;text-align:center;font-size:9px;color:#8aa0ae;}
@media(max-width:850px){.admin-shell{padding:20px 15px}.admin-layout{grid-template-columns:1fr}.admin-sidebar{min-height:auto;display:flex;flex-wrap:wrap;gap:4px;padding:10px}.admin-side-brand{width:100%;margin:0;padding:6px 8px 12px}.admin-tab{width:auto;flex:1;min-width:100px;text-align:center}.admin-stat-grid{grid-template-columns:repeat(2,1fr)}.admin-chart{grid-template-columns:1fr}}
.admin-product-img img,.pcard-img img,.offer-img img,.newcard .img img,.pd-hero img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;}
.admin-product-img.has-photo{background:#eef5f8!important;}
.admin-stock{font-size:10px;color:#718698;margin-top:3px;}
.admin-stock.low{color:#d46725;font-weight:800;}
.admin-select{border:1px solid #dce7ed;border-radius:8px;padding:6px 8px;background:#fff;font:inherit;font-size:11px;color:#29475a;}
.admin-settings-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
.admin-note{background:#f2f8fb;border:1px solid #dbeef4;color:#557083;border-radius:12px;padding:11px;font-size:11px;line-height:1.7;margin-top:14px;}


/* ===== Header ===== */
.app-header{
  background:linear-gradient(160deg,var(--primary) 0%,var(--primary-2) 100%);
  color:#fff;
  padding:6px 20px 22px;
  border-radius:0 0 26px 26px;
  position:relative;
  overflow:hidden;
}
.app-header::after{
  content:"";
  position:absolute;
  top:-40px;left:-30px;
  width:170px;height:170px;
  background:radial-gradient(circle, rgba(55,183,216,.35), transparent 70%);
  pointer-events:none;
}
.header-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.brand{display:flex;align-items:center;gap:9px;}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:#F7FBFC;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);
  padding:4px;
}
.brand-name{font-family:'Almarai';font-weight:800;font-size:19px;letter-spacing:.2px;line-height:1.1;}
.brand-sub{font-size:10px;color:rgba(255,255,255,.68);font-weight:500;margin-top:1px;}
.icon-btn{
  width:38px;height:38px;border-radius:12px;
  background:rgba(255,255,255,.12);
  border:none;color:#fff;
  display:flex;align-items:center;justify-content:center;
  position:relative;cursor:pointer;
}
.icon-btn .dot{
  position:absolute;top:6px;left:7px;width:7px;height:7px;border-radius:50%;
  background:var(--appetite);border:1.5px solid var(--primary);
}
.greeting{margin-top:16px;position:relative;z-index:1;}
.greeting .hi{font-size:14.5px;color:rgba(255,255,255,.82);font-weight:500;}
.greeting .q{font-family:'Almarai';font-weight:800;font-size:18.5px;margin-top:2px;line-height:1.5;}
.search-bar{
  margin-top:16px;
  background:#fff;
  border-radius:14px;
  padding:12px 14px;
  display:flex;align-items:center;gap:9px;
  box-shadow:var(--shadow-md);
  position:relative;z-index:1;
  color:var(--ink-faint);
  font-size:14px;
  cursor:text;
}
.search-bar input{
  border:none;outline:none;flex:1;font-size:14px;font-family:inherit;
  background:transparent;color:var(--ink);
}
.search-bar input::placeholder{color:var(--ink-faint);}
.search-bar svg{flex-shrink:0;color:var(--ink-faint);}

.suggest-panel{
  margin:10px 20px 0;
  background:#fff;border-radius:14px;box-shadow:var(--shadow-md);
  overflow:hidden;
}
.suggest-row{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;font-size:14px;color:var(--ink);
  border-bottom:1px solid var(--line);
  cursor:pointer;
}
.suggest-row:last-child{border-bottom:none;}
.suggest-row b{color:var(--primary);}
.suggest-row svg{color:var(--ink-faint);flex-shrink:0;}

/* ===== Sections ===== */
.section{padding:20px 20px 4px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:13px;}
.section-title{font-family:'Almarai';font-weight:800;font-size:16.5px;color:var(--ink);display:flex;align-items:center;gap:7px;}
.section-link{font-size:12.5px;color:var(--primary-2);font-weight:600;cursor:pointer;}

/* Bento category grid — unified design-system cards */
.cat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-auto-rows:100px;
  gap:11px;
}
.cat-card{
  border-radius:var(--radius-md);
  position:relative;
  overflow:hidden;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:12px;
  color:#fff;
  box-shadow:var(--shadow-sm);
  transition:transform .16s ease, box-shadow .16s ease;
  border:1px solid rgba(255,255,255,.06);
  isolation:isolate;
}
.cat-card:active{transform:scale(.96);}
.cat-card.hero{grid-column:span 2;grid-row:span 2;padding:16px;}
.cat-card.wide{grid-column:span 2;}
/* shared soft-light system: identical on every card regardless of category color */
.cat-card::before{
  content:"";position:absolute;top:-22%;right:-12%;width:75%;height:75%;
  background:radial-gradient(circle, rgba(255,255,255,.6), transparent 68%);
  mix-blend-mode:soft-light;pointer-events:none;z-index:0;
}
.cat-card::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:62%;
  background:linear-gradient(to top, rgba(4,14,22,.48), rgba(4,14,22,0));
  pointer-events:none;z-index:1;
}
.cat-watermark{
  position:absolute;left:auto;right:-6px;bottom:-6px;
  opacity:.96;z-index:0;pointer-events:none;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.22));
}
.cat-card.hero .cat-watermark{right:-2px;bottom:-2px;}
.cat-watermark.logo-center{
  right:50%;bottom:50%;transform:translate(50%,50%);
  filter:drop-shadow(0 5px 12px rgba(0,0,0,.3));
}
.cat-card .icon-wrap{
  position:absolute;top:10px;right:10px;z-index:2;
  width:32px;height:32px;border-radius:10px;
  background:rgba(255,255,255,.22);
  backdrop-filter:blur(3px);
  border:1px solid rgba(255,255,255,.4);
  display:flex;align-items:center;justify-content:center;
}
.cat-card.hero .icon-wrap{width:40px;height:40px;top:14px;right:14px;}
.cat-card .cat-name{font-family:'Almarai';font-weight:700;font-size:13.5px;position:relative;z-index:2;line-height:1.35;}
.cat-card.hero .cat-name{font-size:17px;}
.cat-card .cat-count{font-size:10.5px;color:rgba(255,255,255,.82);margin-top:2px;position:relative;z-index:2;}

/* Carousels */
.carousel{
  display:flex;gap:12px;overflow-x:auto;
  padding:2px 20px 10px;margin:0 -20px;
  scroll-snap-type:x proximity;
}
.carousel::-webkit-scrollbar{display:none;}
.offer-card{
  flex:0 0 164px;
  background:var(--surface);
  border-radius:var(--radius-md);
  padding:10px;
  box-shadow:var(--shadow-sm);
  scroll-snap-align:start;
  cursor:pointer;
}
.offer-img{
  height:84px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  position:relative;margin-bottom:8px;overflow:hidden;isolation:isolate;
}
.offer-img::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 20%, rgba(255,255,255,.5), transparent 65%);mix-blend-mode:soft-light;}
.offer-badge{
  position:absolute;top:7px;right:7px;
  background:var(--appetite);color:#fff;
  font-size:10px;font-weight:700;
  padding:3px 7px;border-radius:7px;z-index:2;
}
.offer-name{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.35;min-height:34px;}
.offer-unit{font-size:10px;color:var(--primary-2);background:var(--primary-tint);display:inline-block;padding:2px 6px;border-radius:6px;margin-top:4px;}
.offer-price-row{display:flex;align-items:baseline;gap:6px;margin-top:7px;}
.price-now{font-family:'Almarai';font-weight:800;font-size:14.5px;color:var(--primary);}
.price-old{font-size:11px;color:var(--ink-faint);text-decoration:line-through;}
.offer-add{
  margin-top:8px;width:100%;background:var(--appetite-tint);color:var(--appetite-dark);
  border:none;border-radius:9px;font-size:11.5px;font-weight:700;padding:7px 0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;
}

.newcard{
  flex:0 0 122px;
  scroll-snap-align:start;
  cursor:pointer;
}
.newcard .img{
  height:96px;border-radius:14px;margin-bottom:7px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.newcard .img::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 20%, rgba(255,255,255,.5), transparent 65%);mix-blend-mode:soft-light;}
.newcard .nm{font-size:12px;font-weight:600;line-height:1.3;}
.newcard .pr{font-size:12.5px;font-weight:800;color:var(--primary);margin-top:3px;font-family:'Almarai';}
.newtag{
  display:inline-block;background:var(--ice-tint);color:#0E7E9C;
  font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px;margin-bottom:5px;
}

/* ===== Category / Product list screen ===== */
.cat-header{
  background:linear-gradient(160deg,var(--primary) 0%,var(--primary-2) 100%);
  color:#fff;padding:6px 18px 16px;border-radius:0 0 22px 22px;
}
.cat-header-top{display:flex;align-items:center;gap:12px;}
.back-btn{
  width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.14);
  border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.cat-header-title{font-family:'Almarai';font-weight:800;font-size:18px;}
.cat-search{
  margin-top:14px;background:rgba(255,255,255,.14);border-radius:12px;
  padding:10px 13px;display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.85);font-size:13.5px;
}
.cat-search input{background:transparent;border:none;outline:none;color:#fff;font-family:inherit;font-size:13.5px;flex:1;}
.cat-search input::placeholder{color:rgba(255,255,255,.7);}

.filter-row{display:flex;gap:8px;padding:14px 18px 4px;overflow-x:auto;}
.filter-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;padding:8px 15px;border-radius:20px;font-size:12.5px;font-weight:600;
  background:var(--surface);color:var(--ink-soft);border:1px solid var(--line);cursor:pointer;white-space:nowrap;
}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

.product-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 18px 20px;
}
.pcard{
  background:var(--surface);border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm);overflow:hidden;
  display:flex;flex-direction:column;
  animation:riseIn .38s cubic-bezier(.22,.61,.36,1) both;
}
@keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.pcard-img{
  height:96px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;overflow:hidden;isolation:isolate;
}
.pcard-img::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 20%, rgba(255,255,255,.5), transparent 65%);mix-blend-mode:soft-light;}
.pcard-discount{
  position:absolute;top:7px;right:7px;background:var(--appetite);color:#fff;
  font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px;z-index:2;
}
.pcard-body{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px;flex:1;}
.pcard-name{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.35;cursor:pointer;}
.pcard-meta{font-size:10.5px;color:var(--ink-faint);}
.pcard-unit{font-size:9.5px;color:var(--primary-2);background:var(--primary-tint);display:inline-block;padding:1.5px 6px;border-radius:6px;width:fit-content;}
.pcard-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;}
.pcard-price{display:flex;flex-direction:column;}
.pcard-price .now{font-family:'Almarai';font-weight:800;font-size:13.5px;color:var(--primary);}
.pcard-price .old{font-size:10px;color:var(--ink-faint);text-decoration:line-through;}
.add-btn{
  background:var(--appetite);color:#fff;border:none;border-radius:10px;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 4px 10px -3px rgba(255,106,69,.55);
}
.qty-stepper{
  display:flex;align-items:center;gap:0;background:var(--primary-tint);border-radius:10px;overflow:hidden;
}
.qty-stepper button{
  width:26px;height:30px;border:none;background:transparent;color:var(--primary);font-size:15px;cursor:pointer;font-weight:700;
}
.qty-stepper .val{font-size:12.5px;font-weight:700;min-width:16px;text-align:center;color:var(--ink);}

/* ===== Product detail sheet ===== */
.pd-hero{
  height:250px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;isolation:isolate;
}
.pd-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.45), transparent 65%);mix-blend-mode:soft-light;}
.pd-hero .back-btn{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.85);color:var(--ink);z-index:2;}
.pd-sheet{
  background:var(--surface);border-radius:26px 26px 0 0;margin-top:-22px;position:relative;z-index:1;
  padding:22px 20px 20px;
}
.pd-brand{font-size:12px;color:var(--ice);font-weight:700;}
.pd-name{font-family:'Almarai';font-weight:800;font-size:19px;margin:5px 0 3px;line-height:1.4;}
.pd-meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.pd-meta-chip{font-size:11.5px;color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:8px;}
.pd-price-row{display:flex;align-items:baseline;gap:10px;margin:14px 0 2px;}
.pd-price-now{font-family:'Almarai';font-weight:800;font-size:23px;color:var(--primary);}
.pd-price-old{font-size:14px;color:var(--ink-faint);text-decoration:line-through;}
.pd-save{background:var(--success-tint);color:var(--success);font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;}
.pd-desc{font-size:13px;color:var(--ink-soft);line-height:1.8;margin-top:14px;}
.pd-qty-block{
  display:flex;align-items:center;justify-content:space-between;margin-top:20px;
  background:var(--primary-tint);border-radius:14px;padding:12px 14px;
}
.pd-qty-label{font-size:13px;font-weight:600;color:var(--primary);}
.pd-stepper{display:flex;align-items:center;gap:14px;}
.pd-stepper button{
  width:36px;height:36px;border-radius:10px;border:none;background:#fff;color:var(--primary);
  font-size:18px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm);
}
.pd-stepper .val{font-family:'Almarai';font-weight:800;font-size:16px;min-width:20px;text-align:center;}
.pd-cta-bar{
  position:sticky;bottom:0;background:var(--surface);
  padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);display:flex;gap:10px;
}
.btn-primary{
  flex:1;background:linear-gradient(135deg,var(--appetite),var(--appetite-dark));
  color:#fff;border:none;border-radius:14px;font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;cursor:pointer;
  box-shadow:0 10px 20px -8px rgba(255,106,69,.55);
}
.btn-primary:active{transform:scale(.98);}
.btn-secondary{
  flex:1;background:var(--primary-tint);color:var(--primary);border:none;border-radius:14px;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;cursor:pointer;
}

/* ===== Order (cart) screen ===== */
.cart-item{
  display:flex;gap:12px;background:var(--surface);border-radius:16px;padding:12px;margin:0 18px 12px;
  box-shadow:var(--shadow-sm);
}
.cart-item-img{width:64px;height:64px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;isolation:isolate;}
.cart-item-img::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 20%, rgba(255,255,255,.5), transparent 65%);mix-blend-mode:soft-light;}
.cart-item-info{flex:1;display:flex;flex-direction:column;min-width:0;}
.cart-item-name{font-size:13px;font-weight:700;}
.cart-item-meta{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.cart-item-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;}
.cart-item-price{display:flex;flex-direction:column;align-items:flex-end;}
.cart-item-price .line-total{font-family:'Almarai';font-weight:800;font-size:13.5px;color:var(--primary);}
.cart-item-price .unit-price{font-size:9.5px;color:var(--ink-faint);}
.cart-remove{background:none;border:none;color:var(--ink-faint);font-size:11px;cursor:pointer;text-decoration:underline;}

.summary-card{
  background:var(--surface);border-radius:18px;margin:6px 18px 0;padding:16px;box-shadow:var(--shadow-sm);
}
.summary-row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);padding:6px 0;}
.summary-row.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;font-weight:800;color:var(--ink);font-size:15.5px;font-family:'Almarai';}
.summary-row.total span:last-child{color:var(--primary);}

.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 30px;text-align:center;color:var(--ink-soft);gap:14px;
}
.empty-state .circle{
  width:84px;height:84px;border-radius:50%;background:var(--primary-tint);
  display:flex;align-items:center;justify-content:center;color:var(--primary);
}
.empty-state h3{font-family:'Almarai';font-size:16px;color:var(--ink);margin:0;}
.empty-state p{font-size:12.5px;margin:0;max-width:220px;line-height:1.7;}

/* ===== Review screen ===== */
.review-block{margin:16px 18px 0;background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow-sm);}
.review-block h4{font-family:'Almarai';font-size:13.5px;margin:0 0 10px;color:var(--ink);}
.review-line{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);padding:5px 0;}
.review-line b{color:var(--ink);font-weight:600;}
textarea.notes{
  width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-family:inherit;
  font-size:13px;resize:none;min-height:64px;color:var(--ink);background:var(--bg);
}

/* ===== Confirmation screen ===== */
.confirm-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 30px 30px;}
.confirm-check{
  width:96px;height:96px;border-radius:50%;
  background:var(--success-tint);color:var(--success);
  display:flex;align-items:center;justify-content:center;margin-bottom:22px;
  animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes pop{0%{transform:scale(0);opacity:0;}100%{transform:scale(1);opacity:1;}}
.confirm-title{font-family:'Almarai';font-weight:800;font-size:20px;margin-bottom:8px;}
.confirm-sub{font-size:13.5px;color:var(--ink-soft);line-height:1.8;max-width:270px;}
.confirm-card{
  width:100%;background:var(--surface);border-radius:18px;padding:18px;margin-top:26px;box-shadow:var(--shadow-sm);text-align:right;
}
.confirm-card .row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;color:var(--ink-soft);}
.confirm-card .row b{color:var(--ink);font-weight:700;}
.confirm-status{
  display:flex;align-items:center;gap:10px;margin-top:22px;width:100%;
}
.confirm-status .step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
.confirm-status .dot{width:10px;height:10px;border-radius:50%;background:var(--success);}
.confirm-status .step.pending .dot{background:var(--line);}
.confirm-status .lbl{font-size:9.5px;color:var(--ink-faint);}
.confirm-status .bar{flex:1;height:2px;background:var(--success);margin-top:-16px;}
.confirm-status .bar.pending{background:var(--line);}

/* ===== Orders list screen ===== */
.order-row{
  background:var(--surface);border-radius:16px;padding:14px 16px;margin:0 18px 12px;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;gap:8px;cursor:pointer;
}
.order-row-top{display:flex;justify-content:space-between;align-items:center;}
.order-id{font-family:'Almarai';font-weight:800;font-size:13.5px;color:var(--ink);}
.order-date{font-size:11px;color:var(--ink-faint);}
.order-row-bottom{display:flex;justify-content:space-between;align-items:center;}
.order-value{font-size:13px;font-weight:700;color:var(--primary);}
.status-chip{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;}
.status-chip .sdot{width:7px;height:7px;border-radius:50%;}
.status-prep{background:var(--warn-tint);color:var(--warn);}
.status-prep .sdot{background:var(--warn);}
.status-transit{background:var(--info-tint);color:var(--info);}
.status-transit .sdot{background:var(--info);}
.status-done{background:var(--success-tint);color:var(--success);}
.status-done .sdot{background:var(--success);}

/* ===== Account screen ===== */
.shop-card{
  margin:16px 18px 0;background:linear-gradient(160deg,var(--primary),var(--primary-2));color:#fff;
  border-radius:20px;padding:20px;box-shadow:var(--shadow-md);position:relative;overflow:hidden;
}
.shop-card::before{content:"";position:absolute;top:-30px;left:-20px;width:130px;height:130px;background:radial-gradient(circle, rgba(55,183,216,.4), transparent 70%);}
.shop-card .avatar{
  width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;margin-bottom:12px;position:relative;z-index:1;
}
.shop-card .shop-name{font-family:'Almarai';font-weight:800;font-size:17px;position:relative;z-index:1;}
.shop-card .owner-name{font-size:12.5px;color:rgba(255,255,255,.82);margin-top:2px;position:relative;z-index:1;}
.info-list{margin:14px 18px 0;background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);}
.info-row{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line);font-size:13px;}
.info-row:last-child{border-bottom:none;}
.info-row .ico{width:32px;height:32px;border-radius:9px;background:var(--primary-tint);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.info-row .txt{flex:1;}
.info-row .lbl{color:var(--ink-faint);font-size:10.5px;}
.info-row .val{color:var(--ink);font-weight:600;margin-top:1px;}
.menu-list{margin:14px 18px 0;background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);}
.menu-row{display:flex;align-items:center;gap:11px;padding:14px 15px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;}
.menu-row:last-child{border-bottom:none;}
.menu-row .ico{width:30px;height:30px;border-radius:9px;background:var(--bg);color:var(--primary-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.menu-row .chev{margin-right:auto;color:var(--ink-faint);}

/* placeholder screens */
.placeholder{padding:70px 30px;text-align:center;color:var(--ink-soft);}
.placeholder svg{color:var(--ink-faint);margin-bottom:14px;}
.placeholder h3{font-family:'Almarai';color:var(--ink);font-size:16px;}

/* ===== Bottom nav ===== */
.bottom-nav{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  display:flex;
  padding:9px 6px calc(9px + env(safe-area-inset-bottom,0px));
  z-index:40;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  border:none;background:none;cursor:pointer;color:var(--ink-faint);padding:4px 0;position:relative;
}
.nav-item .lbl{font-size:10px;font-weight:600;}
.nav-item.active{color:var(--primary);}
.nav-item.active svg{transform:translateY(-1px);}
.nav-item svg{transition:transform .18s ease;}
.nav-cart-badge{
  position:absolute;top:-2px;left:calc(50% + 6px);
  background:var(--appetite);color:#fff;font-size:9px;font-weight:800;
  min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  padding:0 3px;border:1.5px solid #fff;
}

/* toast */
.toast{
  position:absolute;left:50%;bottom:86px;transform:translate(-50%,14px);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:30px;
  font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;
  box-shadow:var(--shadow-lg);z-index:60;opacity:0;pointer-events:none;
  transition:transform .28s cubic-bezier(.22,.61,.36,1), opacity .28s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast .tick{
  width:18px;height:18px;border-radius:50%;background:var(--success);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

/* Focus visibility */
button:focus-visible, .cat-card:focus-visible, .pcard-img:focus-visible{
  outline:2px solid var(--ice); outline-offset:2px;
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

.note-strip{
  margin:18px 20px 0;padding:12px 14px;background:var(--ice-tint);border-radius:14px;
  font-size:11.5px;color:#0E7E9C;line-height:1.7;display:flex;gap:8px;
}

/* ===== Admin modal + internal control panel ===== */
.modal-overlay{
  position:absolute;inset:0;background:rgba(10,25,40,.6);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;
}
.modal-card{
  background:#fff;border-radius:20px;padding:24px 20px;width:100%;max-width:300px;
  box-shadow:var(--shadow-lg);text-align:center;animation:pop .3s cubic-bezier(.34,1.56,.64,1) both;
}
.modal-card h3{font-family:'Almarai';font-size:16px;margin:0 0 6px;color:var(--ink);}
.modal-card p{font-size:12px;color:var(--ink-soft);margin:0 0 16px;}
.modal-card input{
  width:100%;text-align:center;letter-spacing:5px;font-size:18px;padding:12px;
  border:1.5px solid var(--line);border-radius:12px;margin-bottom:14px;font-family:inherit;
  box-sizing:border-box;
}
.modal-card input.err{border-color:var(--appetite);animation:shake .3s;}
@keyframes shake{25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.modal-actions{display:flex;gap:10px;}
.modal-btn-cancel{flex:1;background:var(--bg);color:var(--ink-soft);border:none;border-radius:12px;padding:12px;font-weight:600;cursor:pointer;font-size:13px;}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 18px 0;}
.stat-card{background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow-sm);text-align:center;}
.stat-card .num{font-family:'Almarai';font-weight:800;font-size:20px;color:var(--primary);}
.stat-card .lbl{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
.admin-form{margin:16px 18px 0;background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);}
.admin-form h4{font-family:'Almarai';font-size:13.5px;margin:0 0 12px;color:var(--ink);}
.admin-field{margin-bottom:10px;}
.admin-field label{display:block;font-size:11px;color:var(--ink-faint);margin-bottom:4px;}
.admin-field input, .admin-field select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:13px;background:var(--bg);box-sizing:border-box;
}
.admin-row2{display:flex;gap:10px;}
.admin-row2 .admin-field{flex:1;}
.admin-product-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.admin-product-row:last-child{border-bottom:none;}
.admin-del{background:var(--appetite-tint);color:var(--appetite-dark);border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;}

.ad-board{padding-top:2px;}
.ad-slide{
  flex:0 0 86%;height:130px;scroll-snap-align:start;
  border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);position:relative;
}
.ad-slide img{width:100%;height:100%;object-fit:cover;display:block;}

.customer-auth-card{margin:18px;background:var(--surface,#fff);border-radius:22px;padding:24px;box-shadow:var(--shadow-md,0 8px 24px rgba(0,0,0,.08));text-align:center}.customer-auth-card h3{margin:10px 0 6px;color:var(--ink,#17323f)}.customer-auth-sub{color:var(--ink-muted,#6f838d);font-size:13px;line-height:1.7;margin:0 auto 18px;max-width:320px}.customer-form{text-align:right;display:grid;gap:8px}.customer-form label{font-size:12px;color:var(--ink-muted,#6f838d);font-weight:700;margin-top:6px}.customer-form input,.customer-form textarea{width:100%;box-sizing:border-box;border:1px solid var(--line,#dce5e8);border-radius:12px;padding:12px;font:inherit;background:#fff;color:var(--ink,#17323f)}.customer-form textarea{min-height:84px;resize:vertical}.btn-secondary{border:1px solid var(--line,#dce5e8);background:transparent;border-radius:12px;padding:12px;color:var(--ink,#17323f);font:inherit}
</style>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="stage">
<div id="frame">
  <div id="screens"></div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-nav="home">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      <span class="lbl">الرئيسية</span>
    </button>
    <button class="nav-item" data-nav="categories">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
      <span class="lbl">الأقسام</span>
    </button>
    <button class="nav-item" data-nav="cart" style="position:relative;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 8H6"/></svg>
      <span class="lbl">طلبك</span>
      <span class="nav-cart-badge" id="navCartBadge" hidden>0</span>
    </button>
    <button class="nav-item" data-nav="orders">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
      <span class="lbl">طلباتي</span>
    </button>
    <button class="nav-item" data-nav="account">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.6-4 5-6 8-6s6.4 2 8 6"/></svg>
      <span class="lbl">حسابي</span>
    </button>
  </nav>

  <div class="toast" id="toast"><span class="tick">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  </span><span id="toastText">تمت الإضافة</span></div>
</div>
</div>

<script>
/* ==================================================================
   ⚙️ إعدادات الربط الخارجي — عدّل هذا القسم فقط، لا تلمس الباقي
   ==================================================================
   1) Firebase (لتخزين قائمة صور اللوحة الإعلانية):
      - سجّل مجانًا على https://console.firebase.google.com
      - أنشئ مشروع جديد → فعّل "Firestore Database" (ابدأ بـ Test mode)
      - من Project settings → General → Your apps → أضف "Web app"

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ======================= لوحة الإعلانات (Firebase + imgbb) ======================= */
let BANNERS = []; // {id, url, createdAt}
hydrateStore();
async function loadBanners(){
  if(!firebaseReady) return;
  try{
    const snap = await db.collection('banners').orderBy('createdAt','desc').get();
    BANNERS = snap.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){ console.warn('loadBanners failed:', e); }
}
async function uploadBannerImage(file){
  if(IMGBB_API_KEY.includes('ضع')) throw new Error('NO_IMGBB_KEY');
  const dataUrl = await fileToBase64(file);
  const form = new FormData();
  form.append('image', dataUrl.split(',')[1]);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {method:'POST', body:form});
  const data = await res.json();
  if(!data.success) throw new Error('IMGBB_UPLOAD_FAILED');
  const url = data.data.url;
  if(firebaseReady){
    await db.collection('banners').add({url, createdAt: Date.now()});
    await loadBanners();
  } else {
    BANNERS.unshift({id:'local-'+Date.now(), url}); saveStore();
  }
}
async function deleteBannerImage(id){
  BANNERS = BANNERS.filter(b=>b.id!==id);
  if(firebaseReady && !String(id).startsWith('local-')){
    try{ await db.collection('banners').doc(id).delete(); }catch(e){ console.warn(e); }
  }
}

function cartCount(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
function cartTotal(){
  return Object.entries(state.cart).reduce((sum,[id,q])=>{
    const p = productById(id); return sum + (p? p.price*q : 0);
  },0);
}
function addToCart(id, qty=1){
  state.cart[id] = (state.cart[id]||0) + qty;
  if(state.cart[id]<=0) delete state.cart[id];
  refreshCartUI();
}
function setQty(id, qty){
  if(qty<=0) delete state.cart[id]; else state.cart[id]=qty;
  refreshCartUI();
}
function refreshCartUI(){
  const c = cartCount();
  const badge = document.getElementById('navCartBadge');
  badge.hidden = c===0; badge.textContent = c;
}

/* ======================= NAVIGATION ENGINE ======================= */
const screensEl = document.getElementById('screens');
const renderers = {
  home: renderHome, category: ()=>renderCategory(state.currentCat), product: ()=>renderProduct(state.currentProduct),
  cart: renderCart, review: renderReview, confirm: renderConfirm, orders: renderOrders, account: renderAccount, categories: renderCategoriesList,
  admin: renderAdmin,
};
const navKeyFor = {home:'home',categories:'categories',category:'categories',product:'categories',cart:'cart',review:'cart',confirm:'cart',orders:'orders',account:'account',admin:'account'};

function paintNav(screenName){
  const key = navKeyFor[screenName] || 'home';
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.nav===key));
}

function go(screenName, opts={}){
  document.getElementById('frame').classList.toggle('admin-mode', screenName==='admin');
  const dir = opts.dir || 'forward';
  const incoming = document.createElement('div');
  incoming.className = 'screen ' + (dir==='forward' ? 'enter-right' : 'enter-left');
  incoming.innerHTML = renderers[screenName]();
  screensEl.appendChild(incoming);

  const outgoing = screensEl.querySelector('.screen:not(:last-child)');
  requestAnimationFrame(()=>{
    incoming.classList.remove('enter-right','enter-left');
    if(outgoing){ outgoing.classList.add(dir==='forward' ? 'leave-left' : 'leave-right'); }
    setTimeout(()=>{ if(outgoing) outgoing.remove(); }, 340);
  });

  if(!opts.replace){
    if(dir==='forward') state.stack.push(screenName);
    else state.stack.pop();
  }
  paintNav(screenName);
  bindScreenEvents(incoming, screenName);
  refreshCartUI();
}

function goBack(){
  if(state.stack.length<=1){ return; }
  state.stack.pop();
  const prev = state.stack[state.stack.length-1];
  renderBack(prev);
}
function renderBack(screenName){
  const incoming = document.createElement('div');
  incoming.className = 'screen enter-left';
  incoming.innerHTML = renderers[screenName]();
  screensEl.appendChild(incoming);
  const outgoing = screensEl.querySelector('.screen:not(:last-child)');
  requestAnimationFrame(()=>{
    incoming.classList.remove('enter-left');
    if(outgoing) outgoing.classList.add('leave-right');
    setTimeout(()=>{ if(outgoing) outgoing.remove(); }, 340);
  });
  paintNav(screenName);
  bindScreenEvents(incoming, screenName);
  refreshCartUI();
}

/* ======================= EVENT BINDING ======================= */
function bindScreenEvents(root, screenName){
  root.querySelectorAll('[data-nav-back]').forEach(b=> b.addEventListener('click', goBack));

  root.querySelectorAll('[data-open-cat]').forEach(el=> el.addEventListener('click', ()=>{
    state.currentCat = el.dataset.openCat;
    go('category');
  }));

  root.querySelectorAll('[data-open-product]').forEach(el=> el.addEventListener('click', ()=>{
    state.currentProduct = el.dataset.openProduct;
    go('product');
  }));

  root.querySelectorAll('[data-add]').forEach(el=> el.addEventListener('click', (e)=>{
    e.stopPropagation();
    addToCart(el.dataset.add, 1);
    showToast('تمت الإضافة للطلب ✓');
    go(screenName, {replace:true, dir:'forward'});
  }));

  root.querySelectorAll('[data-qty-inc]').forEach(el=> el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const id = el.dataset.qtyInc; addToCart(id,1);
    go(screenName, {replace:true, dir:'forward'});
  }));
  root.querySelectorAll('[data-qty-dec]').forEach(el=> el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const id = el.dataset.qtyDec; const cur=(state.cart[id]||0)-1; setQty(id,cur);
    if(cur<=0) showToast('تمت الإزالة من الطلب');
    go(screenName, {replace:true, dir:'forward'});
  }));

  if(screenName==='home'){
    const input = root.querySelector('#homeSearchInput');
    input.addEventListener('input', ()=> homeSearchSuggestions(input.value.trim()));
    input.addEventListener('focus', ()=> homeSearchSuggestions(input.value.trim()));

    const mark = root.querySelector('#brandMark');
    mark.addEventListener('click', ()=>{
      adminTapCount++;
      clearTimeout(adminTapTimer);
      adminTapTimer = setTimeout(()=>{ adminTapCount = 0; }, 800);
      if(adminTapCount>=3){ adminTapCount = 0; clearTimeout(adminTapTimer); showAdminPrompt(); }
    });
  }

  if(screenName==='product'){
    const minus = root.querySelector('#pdMinus'), plus = root.querySelector('#pdPlus'), val = root.querySelector('#pdQtyVal');
    minus.addEventListener('click', ()=>{ if(pdQty>1){ pdQty--; val.textContent=pdQty; } });
    plus.addEventListener('click', ()=>{ pdQty++; val.textContent=pdQty; });
    root.querySelector('#pdAddCta').addEventListener('click', ()=>{
      addToCart(state.currentProduct, pdQty);
      showToast('تمت الإضافة إلى طلبك ✓');
      goBack();
    });
  }

  if(screenName==='cart'){
    const btn = root.querySelector('#checkoutBtn');
    if(btn) btn.addEventListener('click', ()=>{ if(!customerProfile){showToast('سجّل بيانات العميل أولاً من حسابي');state.stack.push('account');go('account');return;} if(cartTotal()<MIN_ORDER_TOTAL){showToast('الحد الأدنى للطلب 50 دينار');return;} go('review'); });
  }

  if(screenName==='review'){
    const btn = root.querySelector('#submitOrderBtn');
    if(btn) btn.addEventListener('click', ()=>{ if(!customerProfile){showToast('بيانات العميل مطلوبة');go('account');return;} if(cartTotal()<MIN_ORDER_TOTAL){showToast('الحد الأدنى للطلب 50 دينار');go('cart');return;} createOrderFromCart(); go('confirm'); });
  }

  if(screenName==='confirm'){
    root.querySelector('#backHomeBtn').addEventListener('click', ()=>{
      state.cart = {};
      state.stack = ['home'];
      go('home', {replace:true, dir:'back'});
    });
  }

  if(screenName==='account'){
    root.querySelectorAll('[data-nav]').forEach(el=> el.addEventListener('click', ()=>{
      const target = el.dataset.nav;
      state.stack.push(target);
      go(target, {replace:true});
    }));
  }

  if(screenName==='admin'){
    const showSection = tab => { root.querySelectorAll('[data-admin-section]').forEach(s=>s.hidden=s.dataset.adminSection!==tab); root.querySelectorAll('[data-admin-tab]').forEach(b=>b.classList.toggle('active',b.dataset.adminTab===tab)); };
    root.querySelectorAll('[data-admin-tab]').forEach(b=>b.addEventListener('click',()=>showSection(b.dataset.adminTab)));
    root.querySelector('#adminStorePreview')?.addEventListener('click',()=>{ state.stack=['home']; go('home',{replace:true,dir:'back'}); });
    if(currentAdminRole==='warehouse'){ root.querySelectorAll('[data-admin-tab]').forEach(b=>{if(['overview','products','orders'].indexOf(b.dataset.adminTab)<0)b.style.display='none';}); }
    root.querySelector('#exportReport')?.addEventListener('click',exportStoreReport);
    root.querySelector('#downloadBackup')?.addEventListener('click',downloadBackup);
    root.querySelector('#restoreBackupBtn')?.addEventListener('click',()=>root.querySelector('#restoreBackupFile').click());
    root.querySelector('#restoreBackupFile')?.addEventListener('change',e=>{if(e.target.files[0])restoreBackup(e.target.files[0]);});
    root.querySelector('#enableNotifications')?.addEventListener('click',async()=>{if('Notification' in window){const r=await Notification.requestPermission();showToast(r==='granted'?'تم تفعيل إشعارات الطلبات ✓':'لم يتم السماح بالإشعارات');}else showToast('المتصفح لا يدعم الإشعارات');});
    root.querySelector('#afImage')?.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{pendingProductImage=r.result;const p=root.querySelector('#afImagePreview');p.hidden=false;p.textContent='تم اختيار صورة المنتج ✓';};r.readAsDataURL(f);});
    root.querySelectorAll('[data-del-product]').forEach(btn=>btn.addEventListener('click',()=>{ if(confirm('حذف هذا المنتج؟')){ PRODUCTS=PRODUCTS.filter(p=>p.id!==btn.dataset.delProduct); OFFERS=OFFERS.filter(p=>p.id!==btn.dataset.delProduct); NEW_ARRIVALS=NEW_ARRIVALS.filter(p=>p.id!==btn.dataset.delProduct); showToast('تم حذف المنتج'); saveStore(); go('admin',{replace:true}); }}));
    root.querySelectorAll('[data-edit-product]').forEach(btn=>btn.addEventListener('click',()=>{ const p=productById(btn.dataset.editProduct); showSection('products'); const f=root.querySelector('#adminProductForm'); f.hidden=false; root.querySelector('#afName').value=p.name; root.querySelector('#afBrand').value=p.brand; root.querySelector('#afPrice').value=p.price; root.querySelector('#afUnit').value=p.unit; root.querySelector('#afStock').value=p.stock||0; pendingProductImage=p.image||''; f.dataset.editing=p.id; }));
    root.querySelector('#adminAddProduct')?.addEventListener('click',()=>{ pendingProductImage=''; const f=root.querySelector('#adminProductForm'); f.hidden=false; f.dataset.editing=''; });
    root.querySelector('#closeProductForm')?.addEventListener('click',()=>root.querySelector('#adminProductForm').hidden=true);
    root.querySelector('#afSubmit')?.addEventListener('click',()=>{ const name=root.querySelector('#afName').value.trim(), catId=root.querySelector('#afCat').value, brand=root.querySelector('#afBrand').value.trim()||'—', price=parseFloat(root.querySelector('#afPrice').value), unit=root.querySelector('#afUnit').value.trim()||'قطعة', stock=parseInt(root.querySelector('#afStock').value||'0',10), f=root.querySelector('#adminProductForm'); if(!name||isNaN(price)||price<=0){showToast('الرجاء تعبئة اسم المنتج والسعر');return;} if(f.dataset.editing){const p=productById(f.dataset.editing); Object.assign(p,{name,cat:catId,brand,price,unit,stock,image:pendingProductImage||p.image||''}); showToast('تم تحديث المنتج ✓'); saveStore();} else {const c=CAT_MAP[catId]; const np=prod('p'+(productSeq++),name,'—',brand,price,null,catId,c.grad,c.icon,null,unit); np.stock=stock; np.image=pendingProductImage||''; PRODUCTS.push(np); showToast('تمت إضافة المنتج ✓'); saveStore();} go('admin',{replace:true}); });
    root.querySelectorAll('[data-order-status]').forEach(sel=>sel.addEventListener('change',()=>{ const o=ORDERS.find(x=>x.id===sel.dataset.orderStatus); if(o){o.status=sel.value;o.statusLabel=sel.options[sel.selectedIndex].text;showToast('تم تحديث حالة الطلب'); saveStore(); notifyOrder(`تغيرت حالة ${o.id} إلى ${o.statusLabel}`);} }));
    root.querySelectorAll('[data-view-order]').forEach(btn=>btn.addEventListener('click',()=>showToast('تفاصيل '+btn.dataset.viewOrder+' جاهزة للمراجعة')));
    root.querySelector('#adminAddCategory')?.addEventListener('click',()=>{ const name=prompt('اسم القسم الجديد:'); if(name){showToast('تمت إضافة قسم '+name+' — يمكنك ربطه بالكتالوج بعد الحفظ');} });
    root.querySelector('#saveSettings')?.addEventListener('click',()=>showToast('تم حفظ إعدادات المتجر ✓'));
    const bannerBtn=root.querySelector('#afBannerBtn'), bannerFile=root.querySelector('#afBannerFile'); if(bannerBtn&&bannerFile){bannerBtn.addEventListener('click',()=>bannerFile.click());bannerFile.addEventListener('change',async()=>{const file=bannerFile.files[0];if(!file)return;try{await uploadBannerImage(file);showToast('تمت إضافة الإعلان ✓');go('admin',{replace:true});}catch(e){showToast(e.message==='NO_IMGBB_KEY'?'أضف مفتاح imgbb API أولًا':'تعذّر رفع الإعلان');}});}
    root.querySelectorAll('[data-del-banner]').forEach(btn=>btn.addEventListener('click',async()=>{await deleteBannerImage(btn.dataset.delBanner);showToast('تم حذف الإعلان');go('admin',{replace:true});}));
    root.querySelector('#adminLogout')?.addEventListener('click',()=>{state.stack=['home'];go('home',{replace:true,dir:'back'});});
  }
}

/* ======================= ADMIN PANEL ACCESS ======================= */
const ADMIN_PASSWORD = '199611';
let adminTapCount = 0, adminTapTimer = null;
function showAdminPrompt(){
  if(document.getElementById('adminModal')) return;
  const frame = document.getElementById('frame');
  const wrap = document.createElement('div');
  wrap.className = 'modal-overlay';
  wrap.id = 'adminModal';
  wrap.innerHTML = `
    <div class="modal-card">
      <h3>لوحة التحكم الداخلية</h3>
      <p>اختر الدور وأدخل كلمة المرور</p><select id="adminRole" class="admin-select" style="width:100%;margin-bottom:10px"><option value="manager">مدير المتجر</option><option value="warehouse">مسؤول المخزون والطلبات</option></select>
      <input type="password" id="adminPass" inputmode="numeric" placeholder="••••••">
      <div class="modal-actions">
        <button class="modal-btn-cancel" id="adminCancel">إلغاء</button>
        <button class="btn-primary" id="adminSubmit" style="flex:1;">دخول</button>
      </div>
    </div>`;
  frame.appendChild(wrap);
  const input = wrap.querySelector('#adminPass');
  setTimeout(()=> input.focus(), 50);
  const close = ()=> wrap.remove();
  wrap.querySelector('#adminCancel').addEventListener('click', close);
  const submit = ()=>{
    const role=wrap.querySelector('#adminRole').value; if(input.value === (role==='warehouse'?'199612':ADMIN_PASSWORD)){ currentAdminRole=role;
      close();
      state.stack.push('admin');
      go('admin');
    } else {
      input.classList.remove('err'); void input.offsetWidth; input.classList.add('err');
      input.value = '';
      showToast('كلمة المرور غير صحيحة');
    }
  };
  wrap.querySelector('#adminSubmit').addEventListener('click', submit);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

/* bottom nav clicks */
document.getElementById('bottomNav').addEventListener('click', (e)=>{
  const btn = e.target.closest('.nav-item'); if(!btn) return;
  const target = btn.dataset.nav;
  if(target==='categories'){ go('categories'); return; }
  if(target==='home'){ state.stack=['home']; go('home',{replace:true}); return; }
  state.stack.push(target);
  go(target, {replace:true});
});

/* init */
go('home', {replace:true});
refreshCartUI();
loadBanners().then(()=>{
  if(state.stack[state.stack.length-1] === 'home'){ go('home', {replace:true}); }
});
</script>
